<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>결제 실패</title>
  <link rel="stylesheet" href="/payment-test.css">
</head>
<body>
<!-- 토스페이먼츠 failUrl - 결제창 인증 단계에서 실패하거나 취소한 경우. 승인은 요청되지 않았으므로 청구되지 않는다 -->
<main>
  <h1>결제 실패</h1>
  <pre id="log"></pre>
  <p>주문은 결제 기한까지 결제 대기로 남았다가 만료되면 실패 처리되고 재고가 복구됩니다.</p>
  <a href="/checkout.html">다시 주문하기</a>
</main>
<script>
  const params = new URLSearchParams(window.location.search);
  document.getElementById("log").textContent =
      `orderId: ${params.get("orderId")}\ncode: ${params.get("code")}\nmessage: ${params.get("message")}`;
</script>
</body>
</html>
