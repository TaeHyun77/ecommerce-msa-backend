spring.application.name=order-service
spring.config.import=optional:classpath:application-secret.properties

server.port=8083

spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.url=jdbc:mysql://localhost:3306/ecommerce_order?useUnicode=true&serverTimezone=Asia/Seoul

spring.jpa.hibernate.ddl-auto=update

# product-service 호출 주소 - 컨테이너 배포 시 docker-compose 서비스명(예: http://product-service:8081)으로 교체
external.product-service.base-url=http://localhost:8081
# payment-service 호출 주소 - 컨테이너 배포 시 docker-compose 서비스명(예: http://payment-service:8084)으로 교체
external.payment-service.base-url=http://localhost:8084
# promotion-service 호출 주소 - 컨테이너 배포 시 docker-compose 서비스명(예: http://promotion-service:8087)으로 교체
external.promotion-service.base-url=http://localhost:8087

# 서킷 브레이커 - product-service 호출 (인스턴스명은 @CircuitBreaker(name)과 일치해야 함)
resilience4j.circuitbreaker.instances.productService.sliding-window-type=COUNT_BASED
resilience4j.circuitbreaker.instances.productService.sliding-window-size=20
resilience4j.circuitbreaker.instances.productService.minimum-number-of-calls=10
resilience4j.circuitbreaker.instances.productService.failure-rate-threshold=50
# read timeout(2초)보다 짧게 잡아 타임아웃으로 스레드가 묶이기 전에 서킷이 반응하게 함
resilience4j.circuitbreaker.instances.productService.slow-call-duration-threshold=1s
resilience4j.circuitbreaker.instances.productService.slow-call-rate-threshold=60
resilience4j.circuitbreaker.instances.productService.wait-duration-in-open-state=10s
resilience4j.circuitbreaker.instances.productService.permitted-number-of-calls-in-half-open-state=3
# product-service 자체 장애만 실패로 집계 - 4xx는 호출 계약 오류이므로 제외
resilience4j.circuitbreaker.instances.productService.record-exceptions[0]=com.park.ecommerce.exception.ProductServiceUnavailableException

# 서킷 브레이커 - promotion-service 호출 (인스턴스명은 @CircuitBreaker(name)과 일치해야 함) - product-service와 같은 내부 호출 기준
resilience4j.circuitbreaker.instances.promotionService.sliding-window-type=COUNT_BASED
resilience4j.circuitbreaker.instances.promotionService.sliding-window-size=20
resilience4j.circuitbreaker.instances.promotionService.minimum-number-of-calls=10
resilience4j.circuitbreaker.instances.promotionService.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.promotionService.slow-call-duration-threshold=1s
resilience4j.circuitbreaker.instances.promotionService.slow-call-rate-threshold=60
resilience4j.circuitbreaker.instances.promotionService.wait-duration-in-open-state=10s
resilience4j.circuitbreaker.instances.promotionService.permitted-number-of-calls-in-half-open-state=3
# promotion-service 자체 장애만 실패로 집계 - 4xx는 쿠폰 상태 또는 호출 계약 오류이므로 제외
resilience4j.circuitbreaker.instances.promotionService.record-exceptions[0]=com.park.ecommerce.exception.PromotionServiceUnavailableException

# 재시도 - 주문 생성 중 재고, 쿠폰 선점의 결과를 모를 때 같은 주문번호로 한 번 더 요청 (인스턴스명은 @Retry(name)과 일치해야 함)
# 선점 API가 같은 주문번호를 멱등하게 처리하므로 안전하며, 재시도가 서킷 안쪽 호출을 감싸 시도마다 서킷 판정을 거친다
# 결과 불명(장애 예외)만 재시도 - 서킷 열림(CallNotPermittedException)과 재고 부족, 쿠폰 상태 같은 확정 실패는 다시 보내도 결과가 같으므로 제외
# 대상 서비스가 느려서 생긴 타임아웃일 수 있으므로 1회만 재시도해 부하를 키우지 않음 - 최악의 경우 선점 호출 하나가 read timeout(2초) × 2 + 대기만큼 걸림
resilience4j.retry.instances.stockReservation.max-attempts=2
resilience4j.retry.instances.stockReservation.wait-duration=200ms
resilience4j.retry.instances.stockReservation.retry-exceptions[0]=com.park.ecommerce.exception.ProductServiceUnavailableException
resilience4j.retry.instances.couponReservation.max-attempts=2
resilience4j.retry.instances.couponReservation.wait-duration=200ms
resilience4j.retry.instances.couponReservation.retry-exceptions[0]=com.park.ecommerce.exception.PromotionServiceUnavailableException

# 서킷 브레이커 - payment-service 호출 (인스턴스명은 @CircuitBreaker(name)과 일치해야 함)
resilience4j.circuitbreaker.instances.paymentService.sliding-window-type=COUNT_BASED
resilience4j.circuitbreaker.instances.paymentService.sliding-window-size=20
resilience4j.circuitbreaker.instances.paymentService.minimum-number-of-calls=10
resilience4j.circuitbreaker.instances.paymentService.failure-rate-threshold=50
# 정상 승인도 토스 응답을 기다려 수 초가 걸리므로 느린 호출 기준을 넓게 잡고, 주로 실패율(5xx·타임아웃)로 판단함
resilience4j.circuitbreaker.instances.paymentService.slow-call-duration-threshold=30s
resilience4j.circuitbreaker.instances.paymentService.slow-call-rate-threshold=80
resilience4j.circuitbreaker.instances.paymentService.wait-duration-in-open-state=10s
resilience4j.circuitbreaker.instances.paymentService.permitted-number-of-calls-in-half-open-state=3
# payment-service 자체 장애만 실패로 집계 - 4xx는 호출 계약 오류이므로 제외
resilience4j.circuitbreaker.instances.paymentService.record-exceptions[0]=com.park.ecommerce.exception.PaymentServiceUnavailableException

# 결제 기한 - 주문 생성 시점부터 이 시간 안에 결제해야 하며, 재고 선점 만료 시각으로도 그대로 쓴다 (데모 시 1m으로 줄여 확인)
order.payment-waiting.ttl=10m
# 결제 기한 만료 스케줄러 - 결제 기한이 지난 결제 대기 주문은 최대 이 주기만큼 늦게 실패 처리된다
order.payment-waiting.expire-poll-delay=10s
# 결제 승인 복구 스케줄러 - 결과를 모른 채 끝난 승인 중(APPROVING) 주문은 다음 주기에 바로 다시 처리한다
order.approval-recovery.poll-delay=10s
# 결과 불명 표시를 못 남기고 서버가 멈춘 주문을 위한 안전망 - 승인 시작 후 이 시간이 지나면 다시 처리한다
# payment-service가 토스 승인을 최대 60초 기다리고 이쪽은 70초까지 기다리므로, 진행 중인 요청과 겹치지 않도록 그보다 길게 둔다
order.approval-recovery.stale-after=2m
# 재시도 상한 - 승인 시작 후 이 시간이 지나도 확정되지 않으면 재시도를 멈추고 오류 로그로 알려 수동 확인한다
# 토스 인증 유효 시간(10분) 안에 승인 요청이 도달하지 못한 건이 만료로 확정되고, 그 뒤 재시도가 한 번 돌 수 있도록 여유를 더한 값
order.approval-recovery.give-up-after=15m
