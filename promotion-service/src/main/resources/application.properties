spring.application.name=promotion-service
spring.config.import=optional:classpath:application-secret.properties

server.port=8087

spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.url=jdbc:mysql://localhost:3306/ecommerce_promotion?useUnicode=true&serverTimezone=Asia/Seoul

spring.jpa.hibernate.ddl-auto=update

spring.data.redis.host=localhost
spring.data.redis.port=6379
# Redis 장애 시 발급 요청이 오래 묶이지 않고 DB 처리로 넘어가도록 짧게 - Lettuce 기본값은 연결 10초, 명령 60초
# 동시 요청이 몰리면 명령이 Redis에서 잠시 줄을 서므로 검색 서비스(200ms)보다 여유를 둠
spring.data.redis.connect-timeout=500ms
spring.data.redis.timeout=500ms

# 결제 기한이 지난 쿠폰 선점을 해제하는 주기 - 재고 선점 만료와 같은 주기
coupon.reservation.expire-poll-delay=10s
