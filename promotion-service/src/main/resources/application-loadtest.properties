# 선착순 쿠폰 부하 테스트 전용 - 연결 단계에서 요청이 버려지지 않게 해 쿠폰 발급 로직 자체를 측정하기 위함
# 요청 처리 스레드(기본 200)와 커넥션 풀(기본 10)은 바꾸지 않음 - 비교 대상인 기준 구조를 그대로 두기 위해

# 동시 1만 연결을 모두 받아들이도록 기본 8,192보다 크게 설정
server.tomcat.max-connections=20000
# listen backlog - 실제 크기는 min(이 값, 커널 net.core.somaxconn)이라 커널 값도 함께 올려야 함
server.tomcat.accept-count=10000
# 작업 스레드를 최대치(200)만큼 항상 유지 - 실행 사이 휴지(60초 이상) 동안 스레드가 정리됐다가
# 다음 실행에서 새로 만들어지면 실행마다 조건이 달라지므로. 동시 처리 최대 수(threads.max=200)는 그대로
server.tomcat.threads.min-spare=200

# k6가 보낸 요청 수와 서버가 받은 요청 수를 대조하고, 서버 처리 시간(ms)을 k6 지연과 비교하기 위함
server.tomcat.accesslog.enabled=true
server.tomcat.accesslog.directory=${ACCESS_LOG_DIR:/tmp/promotion-loadtest}
server.tomcat.accesslog.prefix=access
server.tomcat.accesslog.suffix=.log
server.tomcat.accesslog.pattern=%t "%r" %s %{ms}T
